[package]
name = "veriwipe"
version = "1.0.0"
edition = "2021"
authors = ["Team @Enigm@ <enigma.sih2026@veriwipe.local>"]
description = "Integrated Secure Data Erasure & Advanced Forensic File Recovery Platform (SIH 2026 / NTRO PS 26149)"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
crossterm = "0.27"
hex = "0.4"
uuid = { version = "1.8", features = ["v4", "serde"] }
walkdir = "2.5"
sysinfo = "0.30"
libc = "0.2"
async-stream = "0.3"
futures-util = "0.3"
